name: Build & Deploy

on:
  push:
    # A source branch publishes to its own directory, so a requester can add it in Mana
    # and try the extension before it reaches the live catalogue on main.
    branches: [main, "source/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # package-lock.json is gitignored, so there is nothing for `npm ci` to read.
      - run: npm install --no-audit --no-fund

      # On a source/<id> branch, publish only that source so the preview install URL
      # holds the one thing under review rather than the whole catalogue.
      # Actions expressions have no replace(), so strip the prefix in the shell.
      - run: |
          if [[ "$GITHUB_REF_NAME" == source/* ]]; then
            export MANA_ONLY="${GITHUB_REF_NAME#source/}"
            echo "preview limited to $MANA_ONLY"
          fi
          npm run lint && npm run typecheck && npm run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: ${{ github.ref_name }}
