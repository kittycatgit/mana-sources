name: Build & Deploy

on:
  push:
    # A source branch publishes to its own directory, so a requester can add it in Mana
    # and try the extension before it reaches the live catalogue on main.
    branches: [main, "source/**"]
  workflow_dispatch:

permissions:
  contents: write
  # The page lists what is in testing and links each to its thread, which means reading them.
  issues: read

# One group per branch. A single group for everything serialises them, which sounds right —
# they all push to gh-pages — but a group holds one running and one pending run and cancels
# the rest, so ten branches pushed together deploy twice and drop eight. Per branch, a
# publish only ever waits behind another publish of the same preview.
#
# Two branches can still collide on the gh-pages ref, which fails the push rather than
# corrupting anything; re-running the failed deploy is the fix.
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # package-lock.json is gitignored, so there is nothing for `npm ci` to read.
      - run: npm install --no-audit --no-fund

      # On a source/<id> branch, publish only that source so the preview install URL
      # holds the one thing under review rather than the whole catalogue.
      # Actions expressions have no replace(), so strip the prefix in the shell.
      - run: |
          if [[ "$GITHUB_REF_NAME" == source/* ]]; then
            export MANA_ONLY="${GITHUB_REF_NAME#source/}"
            echo "preview limited to $MANA_ONLY"
          fi
          npm run lint && npm run typecheck && npm run build
        env:
          # The install page resolves each in-testing source to its issue thread, which
          # needs a token to read them. Without one it falls back to a search link.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A preview with no sources in it is worse than no preview: the app adds the repo
      # happily and then shows nothing, which reads as a broken source rather than a
      # broken publish. It happened once — a source branch pushed at main's tip built a
      # tree that did not contain its own source — and took a day to recognise, so fail
      # here instead of deploying the empty catalogue over the good one.
      - run: |
          count=$(node -e "process.stdout.write(String((require('./dist/sources.json').sources ?? []).length))")
          echo "built $count source(s)"
          if [[ "$count" == "0" ]]; then
            echo "::error::built no sources — refusing to publish an empty catalogue over ${GITHUB_REF_NAME}"
            exit 1
          fi

      # Published by hand rather than by the action, because the action cannot retry.
      # Every branch writes into its own directory of one shared gh-pages ref, so two
      # deploys finishing together lose one to "cannot lock ref" — the publish is simply
      # dropped, and only the run's own red tick says so. Nothing here conflicts in
      # content: each run touches one directory. So a rejected push is re-tried against
      # whatever landed in the meantime.
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          work="$(mktemp -d)"
          git clone --quiet --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"

          for attempt in 1 2 3 4 5; do
            rm -rf "${work:?}/${GITHUB_REF_NAME:?}"
            mkdir -p "$work/$GITHUB_REF_NAME"
            cp -R dist/. "$work/$GITHUB_REF_NAME/"

            git -C "$work" add -A "$GITHUB_REF_NAME"
            if git -C "$work" diff --cached --quiet; then
              echo "nothing to publish for $GITHUB_REF_NAME"
              exit 0
            fi
            git -C "$work" commit -q -m "deploy: ${GITHUB_SHA}"

            if git -C "$work" push --quiet origin gh-pages; then
              echo "published $GITHUB_REF_NAME on attempt $attempt"
              exit 0
            fi

            echo "gh-pages moved under us; re-trying ($attempt)"
            git -C "$work" reset --hard --quiet HEAD~1
            git -C "$work" fetch --quiet --depth 1 origin gh-pages
            git -C "$work" reset --hard --quiet origin/gh-pages
            sleep $(( attempt * 5 ))
          done

          echo "::error::could not publish $GITHUB_REF_NAME after five attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
