name: Request a source
description: Ask for a comic site to be added to this repository
title: "Source request: "
labels: ["source-request"]
body:
  - type: markdown
    attributes:
      value: |
        One site per request. A maintainer reviews it before anything runs.

        Once it is built you will get a link here to install that source on its own,
        so you can try it and say what is wrong before it joins the catalogue.
  - type: input
    id: url
    attributes:
      label: Site URL
      description: The site's home page, https only.
      placeholder: https://example.com
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything worth knowing
      description: >-
        Optional. A login wall, a region block, a page that behaves oddly.
        This is read by a human only — it is never passed to the build.
    validations:
      required: false
